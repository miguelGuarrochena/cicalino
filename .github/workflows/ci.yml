name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the run still going for the older
# commit. No point burning minutes on a diff nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each step runs even if an earlier one failed, so a single run reports
      # everything that's wrong instead of one thing at a time.
      - name: Typecheck
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Lint
        if: '!cancelled()'
        run: pnpm lint

      - name: Tests
        if: '!cancelled()'
        run: pnpm test:run

      # Runs without real Supabase credentials on purpose: the app has to build
      # without them, and it does — the client factories return null and the
      # pages fall back to demo mode.
      - name: Build
        if: '!cancelled()'
        run: pnpm build
