<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cicalino — sin conexión</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; padding: 24px; text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f1da; color: #20264f;
      }
      @media (prefers-color-scheme: dark) { body { background: #10142f; color: #ede9ce; } }
      .mascota { width: 150px; height: auto; }
      .m-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .m-light { display: none; }
        .m-dark { display: block; }
      }
      h1 { font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: -0.02em; }
      p { margin: 0; opacity: 0.7; max-width: 28rem; }
      button {
        margin-top: 8px; border: none; border-radius: 999px; cursor: pointer;
        background: #2536d4; color: #f4f1da; font-weight: 600; font-size: 15px;
        padding: 12px 24px; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <img class="mascota m-light" src="/bell-light.png" alt="" width="150" height="150" />
    <img class="mascota m-dark" src="/bell-dark.png" alt="" width="150" height="150" />
    <h1>Sin conexión</h1>
    <p>No pudimos cargar la página. Revisá tu conexión y volvé a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
